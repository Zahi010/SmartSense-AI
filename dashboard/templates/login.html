<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Room Monitoring — Login</title>
    <meta name="description" content="Secure login portal for the Smart Room Monitoring System.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080a12;
            --card-bg: rgba(15, 20, 40, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f1f5f9;
            --muted: #64748b;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --cyan: #06b6d4;
            --green: #10b981;
            --red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 15% 30%, rgba(99, 102, 241, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 70%, rgba(6, 182, 212, 0.14) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: drift 12s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 { width: 500px; height: 500px; background: #6366f1; top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 400px; height: 400px; background: #06b6d4; bottom: -100px; right: -100px; animation-delay: -6s; }
        .orb-3 { width: 300px; height: 300px; background: #10b981; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -3s; }
        @keyframes drift {
            from { transform: translate(0, 0); }
            to   { transform: translate(30px, 20px); }
        }

        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 1rem;
        }

        /* Branding */
        .brand {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease both;
        }
        .brand-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 0 20px rgba(99,102,241,0.6));
        }
        .brand h1 {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #67e8f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        .brand p {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 0.4rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 0 0 1px rgba(99,102,241,0.05),
                0 25px 60px rgba(0,0,0,0.5),
                0 0 80px rgba(99,102,241,0.06) inset;
            animation: fadeInUp 0.6s ease 0.1s both;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, var(--primary), var(--cyan));
            border-radius: 4px;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .input-wrap {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.5;
            pointer-events: none;
        }
        .form-group input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 12px 14px 12px 40px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            border-color: var(--primary);
            background: rgba(99,102,241,0.06);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.2); }

        /* Toggle password */
        .toggle-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.4;
            transition: opacity 0.2s;
            background: none;
            border: none;
            color: var(--text);
            padding: 0;
        }
        .toggle-pass:hover { opacity: 0.9; }

        /* Error message */
        .error-msg {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }
        .error-msg.show { display: flex; }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            border: none;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(99,102,241,0.35);
            margin-top: 0.5rem;
        }
        .btn-login::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            transition: all 0.4s ease;
        }
        .btn-login:hover::before { top: -50%; left: -50%; }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99,102,241,0.5);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading spinner */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Hint table */
        .hint-box {
            margin-top: 1.75rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1.25rem;
        }
        .hint-label {
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }
        .hint-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .hint-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 0.6rem 0.75rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .hint-item:hover {
            background: rgba(99,102,241,0.08);
            border-color: rgba(99,102,241,0.25);
        }
        .hint-role {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 0.3rem;
        }
        .role-admin { background: rgba(239,68,68,0.15); color: #fca5a5; }
        .role-user  { background: rgba(99,102,241,0.15); color: #a5b4fc; }
        .hint-creds { color: var(--text); font-weight: 500; }
        .hint-pass  { color: var(--muted); font-size: 0.75rem; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-container">
        <div class="brand">
            <span class="brand-icon">🏠</span>
            <h1>Smart Room Monitoring</h1>
            <p>Secure Access Portal</p>
        </div>

        <div class="card">
            <div class="card-title">Sign in to your account</div>

            {% if error %}
            <div class="error-msg show">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            <div id="js-error" class="error-msg"></div>

            <form id="login-form" method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                        <button type="button" class="toggle-pass" onclick="togglePassword()" id="toggle-btn">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="login-btn">
                    Sign In &nbsp;→
                </button>
            </form>

            <!-- Quick-fill hints -->
            <div class="hint-box">
                <div class="hint-label">Quick Fill — click to auto-fill credentials</div>
                <div class="hint-grid">
                    <div class="hint-item" onclick="fillCreds('admin','admin123')">
                        <span class="hint-role role-admin">Admin</span><br>
                        <span class="hint-creds">admin</span><br>
                        <span class="hint-pass">admin123</span>
                    </div>
                    <div class="hint-item" onclick="fillCreds('alice','alice123')">
                        <span class="hint-role role-user">Resident</span><br>
                        <span class="hint-creds">alice</span><br>
                        <span class="hint-pass">alice123</span>
                    </div>
                    <div class="hint-item" onclick="fillCreds('bob','bob123')">
                        <span class="hint-role role-user">Resident</span><br>
                        <span class="hint-creds">bob</span><br>
                        <span class="hint-pass">bob123</span>
                    </div>
                    <div class="hint-item" onclick="fillCreds('charlie','charlie123')">
                        <span class="hint-role role-user">Resident</span><br>
                        <span class="hint-creds">charlie</span><br>
                        <span class="hint-pass">charlie123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pass = document.getElementById('password');
            const btn = document.getElementById('toggle-btn');
            if (pass.type === 'password') {
                pass.type = 'text';
                btn.textContent = '🙈';
            } else {
                pass.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function fillCreds(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('username').focus();
        }

        document.getElementById('login-form').addEventListener('submit', function() {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Authenticating…';
        });
    </script>
</body>
</html>
